<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quy trình Huấn luyện & Đánh giá PhoBERT ViHSD</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .frame {
      max-width: 820px;
      width: 100%;
    }

    .header {
      margin-bottom: 2rem;
      border-bottom: 1.5px solid #111827;
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .header p {
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.4;
    }

    .diagram-container {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 2rem 1.25rem;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    svg path,
    svg line {
      fill: none;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="header">
      <h1 align="center">PIPELINE HUẤN LUYỆN MÔ HÌNH PHOBERT-VIHSD</h1>
      <p>Nhóm: Nhóm 2</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 760 970" xmlns="http://www.w3.org/2000/svg" role="img">
        <defs>
          <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
            <polygon points="0 0, 7 2.5, 0 5" fill="#111827" />
          </marker>
        </defs>

        <!-- ĐƯỜNG DỌC LIÊN KẾT -->
        <line x1="55" y1="45" x2="55" y2="895" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" />

        <!-- BƯỚC 1 -->
        <g id="step1">
          <circle cx="55" cy="55" r="16" fill="#111827" />
          <text x="55" y="60" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

          <rect x="95" y="20" width="640" height="70" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
          <text x="115" y="44" font-size="13.5" font-weight="700" fill="#111827">Bước 1: Nạp & Phân chia Bộ dữ liệu
            ViHSD (33,400 mẫu)</text>
          <text x="115" y="64" font-size="12" fill="#4b5563">• Chia theo tỷ lệ gốc: Train 24,048 mẫu (72%) · Dev 2,672
            mẫu (8%) · Test 6,680 mẫu (20%)</text>
        </g>
        <line x1="55" y1="71" x2="55" y2="152" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- BƯỚC 2 -->
        <g id="step2">
          <circle cx="55" cy="170" r="16" fill="#111827" />
          <text x="55" y="175" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

          <rect x="95" y="135" width="640" height="70" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
          <text x="115" y="159" font-size="13.5" font-weight="700" fill="#111827">Bước 2: Tiền xử lý & Làm sạch Dữ
            liệu</text>
          <text x="115" y="179" font-size="12" fill="#4b5563">• Xóa câu trùng trong Train; Chuẩn hóa Teencode & từ viết
            tắt; Xóa Emoji, URL; Chuẩn hóa Unicode NFC</text>
        </g>
        <line x1="55" y1="186" x2="55" y2="267" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- BƯỚC 3 -->
        <g id="step3">
          <circle cx="55" cy="285" r="16" fill="#111827" />
          <text x="55" y="290" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

          <rect x="95" y="250" width="640" height="70" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
          <text x="115" y="274" font-size="13.5" font-weight="700" fill="#111827">Bước 3: Tách từ Tiếng Việt &
            Tokenize</text>
          <text x="115" y="294" font-size="12" fill="#4b5563">• Nối từ ghép bằng RDRSegmenter / PyVi (ví dụ: ngôn_từ,
            thù_ghét); PhoBERT Tokenizer (max_len = 128)</text>
        </g>
        <line x1="55" y1="301" x2="55" y2="382" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- BƯỚC 4 -->
        <g id="step4">
          <circle cx="55" cy="400" r="16" fill="#111827" />
          <text x="55" y="405" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

          <rect x="95" y="365" width="640" height="70" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
          <text x="115" y="389" font-size="13.5" font-weight="700" fill="#111827">Bước 4: Tính toán Trọng số Lớp (Class
            Weight)</text>
          <text x="115" y="409" font-size="12" fill="#4b5563">• Tính từ tập Train bằng Balanced Weight: phạt nhẹ lớp
            CLEAN (~0.40), phạt nặng lớp OFF/HATE (~3.2 - 4.9)</text>
        </g>
        <line x1="55" y1="416" x2="55" y2="497" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- BƯỚC 5 -->
        <g id="step5">
          <circle cx="55" cy="550" r="16" fill="#111827" />
          <text x="55" y="555" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

          <rect x="95" y="480" width="640" height="135" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
          <text x="115" y="504" font-size="13.5" font-weight="700" fill="#111827">Bước 5: Huấn luyện Đối chứng A/B (Chạy
            trên 4 Seeds ngẫu nhiên: 42, 123, 456, 789)</text>
          <text x="115" y="524" font-size="11.5" fill="#4b5563">Cấu hình: lr = 2e-5, batch = 16, 4 epochs, FP16, AdamW.
            Chọn Checkpoint tốt nhất qua Macro F1 trên tập Dev.</text>

          <!-- Mô hình A -->
          <rect x="115" y="535" width="295" height="65" rx="2" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" />
          <text x="125" y="554" font-size="12.5" font-weight="700" fill="#111827">Mô hình A (Baseline)</text>
          <text x="125" y="571" font-size="11" fill="#4b5563">• Hàm mất mát: Standard Cross-Entropy (Không trọng
            số)</text>
          <text x="125" y="588" font-size="11" fill="#4b5563">• File dự đoán: predictions_A_seed{s}.csv</text>

          <!-- Mô hình B -->
          <rect x="425" y="535" width="295" height="65" rx="2" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" />
          <text x="435" y="554" font-size="12.5" font-weight="700" fill="#111827">Mô hình B (Proposed)</text>
          <text x="435" y="571" font-size="11" fill="#4b5563">• Hàm mất mát: Weighted Cross-Entropy (Có trọng số
            lớp)</text>
          <text x="435" y="588" font-size="11" fill="#4b5563">• File dự đoán: predictions_B_seed{s}.csv</text>
        </g>
        <line x1="55" y1="615" x2="55" y2="717" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow)" />

        <!-- BƯỚC 6 -->
        <g id="step6">
          <circle cx="55" cy="780" r="16" fill="#111827" />
          <text x="55" y="785" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

          <rect x="95" y="700" width="640" height="155" rx="3" fill="#ffffff" stroke="#111827" stroke-width="1.2" />
          <text x="115" y="725" font-size="13.5" font-weight="700" fill="#111827">Bước 6: Đánh giá trên tập Test và tổng
            hợp Kết quả</text>
          <text x="115" y="747" font-size="12" fill="#4b5563">• Tính điểm: Macro F1 (chỉ số quyết định chính), Weighted
            F1, Precision & Recall chi tiết từng lớp</text>
          <text x="115" y="767" font-size="12" fill="#4b5563">• Ma trận nhầm lẫn (Confusion Matrix 3x3): Soi chi tiết
            lỗi bắt nhầm giữa CLEAN, OFFENSIVE và HATE</text>
          <text x="115" y="787" font-size="12" fill="#4b5563">• Đối chứng trực quan: Vẽ 2 ma trận A/B cạnh nhau để chứng
            minh Class Weight giảm bỏ sót câu HATE</text>
          <text x="115" y="807" font-size="12" fill="#4b5563">• Thống kê 4 seeds: Tính Giá trị Trung bình ± Độ lệch
            chuẩn (Mean ± Std) và mức chênh lệch Δ(B - A)</text>
          <text x="115" y="832" font-size="12" font-weight="600" fill="#111827">► Sản phẩm bàn giao: predictions.csv (Mô
            hình B), aggregated_metrics.csv, Checkpoints & Báo cáo A/B</text>
        </g>
      </svg>
    </div>
  </div>
</body>

</html>
